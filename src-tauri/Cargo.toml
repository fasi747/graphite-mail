[package]
name = "graphite-mail"
version = "1.7.0"
description = "Offline-first Microsoft 365 mail & calendar client for Linux"
authors = ["Faisal Gillani"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "o365mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
uuid = { version = "1.28.0", features = ["v4"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
anyhow = "1.0.104"
dirs = "7.0.0"
libc = "0.2"
chrono = "0.4.45"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
mail-parser = "0.11.9"
mail-builder = "1.0.0"
futures = "0.3.34"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
