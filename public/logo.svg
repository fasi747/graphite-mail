<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b515d"/>
      <stop offset="1" stop-color="#1b1e25"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="capL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9cfd9"/></linearGradient>
    <linearGradient id="capR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dee6"/><stop offset="1" stop-color="#9ea6b4"/></linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7afbd"/><stop offset="1" stop-color="#5f6778"/></linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#737c8d"/><stop offset="1" stop-color="#363b46"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cb0ff"/><stop offset="1" stop-color="#0a6cff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="envShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001a40" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>

  <!-- Tall faceted graphite crystal -->
  <g filter="url(#shadow)">
    <polygon points="512,196 512,392 330,322" fill="url(#capL)"/>
    <polygon points="512,196 694,322 512,392" fill="url(#capR)"/>
    <polygon points="330,322 512,392 512,832 330,712" fill="url(#faceL)"/>
    <polygon points="694,322 512,392 512,832 694,712" fill="url(#faceR)"/>
    <polyline points="330,322 512,392 694,322" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-linejoin="round"/>
    <line x1="512" y1="196" x2="512" y2="392" stroke="#fff" stroke-opacity=".5" stroke-width="4"/>
    <line x1="512" y1="392" x2="512" y2="832" stroke="#fff" stroke-opacity=".22" stroke-width="4"/>
  </g>

  <!-- Envelope emblem -->
  <g filter="url(#envShadow)">
    <rect x="388" y="508" width="248" height="172" rx="26" fill="url(#env)"/>
    <path d="M404 532 L512 612 L620 532" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
